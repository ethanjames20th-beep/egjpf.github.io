<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Bio</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
    
@font-face{
    font-family:'Jersey';
    src:url('Jersey M54.ttf');
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}
    
:root{
    --bg: #000000;
    --card: #1b1b1b;
    --button: #3a3a3a;
    --accent: #5865F2;
    --text: white;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Jersey';
}

body{
    background: var(--bg);
    color: var(--text);

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;
}

.card{
    width:380px;
    padding:30px;
    text-align:center;

    background: var(--card);
    border-radius:4px;
    border:1px solid rgba(255,255,255,0.08);

    animation:fadeIn 2s ease;
}

.avatar{
    width:130px;
    height:130px;
    border-radius:50%;
    border:4px solid black;
    object-fit:cover;
}

.username{
    margin-top:15px;
    font-size:3rem;
    font-family:'Jersey';
}

.tag{
    margin-top:8px;
    color:#b5bddf;
}

.links{
    margin-top:25px;
}

.links a{
    display:block;

    text-decoration:none;
    color:white;

    background:var(--button);

    margin-top:12px;
    padding:15px;

    border-radius:4px;

    transition:0.2s;
}

.links a i{
    margin-right:10px;
    font-size: 1.1rem;
}

.links a:hover{
    transform:translateY(-2px);
    background:#2b3570;
}
</style>
</head>
<body>

<div class="card">

    <!-- PROFILE PICTURE -->
    <img
    class="avatar"
    src="https://www.image2url.com/r2/default/images/1780842354392-1f5268fb-39c0-473c-9268-1fd77aa6618d.jpg">

    <!-- USERNAME -->
    <div class="username">E-G-J ✞ </div>

    <!-- CUSTOM TAG -->
    <div class="tag">
       Tyla ✝🌺🩷
    </div>

    <!-- LINKS -->
    <div class="links">

        <a href="https://www.tiktok.com/@egj.iom" target="_blank">
            <i class="fa-brands fa-tiktok"></i> Tiktok
        </a>

        <a href="https://www.instagram.com/egj.iom/" target="_blank">
            <i class="fa-brands fa-instagram"></i> Instagram
        </a>

        <a href="https://steamcommunity.com/profiles/76561199367718817/" target="_blank">
            <i class="fa-brands fa-steam"></i> Steam
        </a>

        <a href="https://discordapp.com/users/1095396842285584448" target="_blank">
            <i class="fa-brands fa-discord"></i> Discord
        </a>

    </div>

</div>

<!-- MUSIC -->
<audio autoplay loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

</body>
</html>
