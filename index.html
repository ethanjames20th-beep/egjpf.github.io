<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Bio</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
    
@font-face{
    font-family:'Jersey';
    src:url('Jersey M54.ttf');
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}
    
:root{
    --bg: #000000;
    --card: rgba(27, 27, 27, 0.85);
    --button: #3a3a3a;
    --accent: #5865F2;
    --text: white;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Jersey';
}

body{
    background-image:url("https://www.image2url.com/r2/default/images/1780848547331-d639aa03-9860-4568-9108-0b8e74d2d431.jpg");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;
    
    color: var(--text);

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;
}

.card{
    position:relative;
    
    width:380px;
    padding:30px;
    text-align:center;

    background: var(--card);
    border-radius:4px;
    border:1px solid rgba(255,255,255,0.08);

    animation:fadeIn 2s ease;
}

.avatar{
    width:130px;
    height:130px;
    border-radius:50%;
    border:4px solid black;
    object-fit:cover;
}

.username{
    margin-top:15px;
    font-size:3rem;
    font-family:'Jersey';
}

.tag{
    margin-top:8px;
    color:#b5bddf;
}

.links{
    margin-top:25px;
}

.links a{
    display:block;

    text-decoration:none;
    color:white;

    background:var(--button);

    margin-top:12px;
    padding:15px;

    border-radius:4px;

    transition:0.2s;
}

.links a i{
    margin-right:10px;
    font-size: 1.1rem;
}

.links a:hover{
    transform:translateY(-2px);
    background:#2b3570;
}

#muteBtn{
    position:absolute;
    top:15px;
    right:15px;

    width:36px;
    height:36px;

    border:1px solid rgba(255,255,255,0.1);
    background:#2f2f2f;

    color:white;

    cursor:pointer;

    transition:0.2s;
}

#muteBtn:hover{
    background:#444444;
}

/* SIDE PHOTOS */

.side-photo{
    position:absolute;

    width:160px;
    height:220px;

    background:rgba(27,27,27,0.85);

    border:1px solid rgba(255,255,255,0.08);
    border-radius:4px;

    overflow:hidden;

    animation:fadeIn 2s ease;

    box-shadow:0 0 15px rgba(0,0,0,0.4);
}

.side-photo img{
    width:100%;
    height:100%;
    object-fit:contain;
}

.left-photo{
    top:50px;
    left:50px;
}

.right-photo{
    top:50px;
    right:50px;
}
    
</style>    
</head>
<body>

<!-- LEFT PHOTO -->
<div class="side-photo left-photo">
    <img src="https://www.image2url.com/r2/default/images/1780919008878-488b8298-3eca-4bd7-9ecd-95a8700dcc42.jpg" alt="Left Photo">
</div>

<!-- RIGHT PHOTO -->
<div class="side-photo right-photo">
    <img src="https://www.image2url.com/r2/default/images/1780919266264-da10d110-51a6-425e-9422-ddc228cfcfbc.jpg" alt="Right Photo">
</div>

<div class="card">

    <button id="muteBtn" onclick="toggleMusic()">
        <i class="fa-solid fa-volume-xmark"></i>
    </button>

    <!-- PROFILE PICTURE -->
    <img
    class="avatar"
    src="https://www.image2url.com/r2/default/images/1780842354392-1f5268fb-39c0-473c-9268-1fd77aa6618d.jpg">

    <!-- USERNAME -->
    <div class="username">E-G-J ✞ </div>

    <!-- CUSTOM TAG -->
    <div class="tag">
       Tyla ✝🌺🩷
    </div>

    <!-- LINKS -->
    <div class="links">

        <a href="https://www.tiktok.com/@egj.iom" target="_blank">
            <i class="fa-brands fa-tiktok"></i> Tiktok
        </a>

        <a href="https://www.instagram.com/egj.iom/" target="_blank">
            <i class="fa-brands fa-instagram"></i> Instagram
        </a>

        <a href="https://steamcommunity.com/profiles/76561199367718817/" target="_blank">
            <i class="fa-brands fa-steam"></i> Steam
        </a>

        <a href="https://discordapp.com/users/1095396842285584448" target="_blank">
            <i class="fa-brands fa-discord"></i> Discord
        </a>

    </div>

</div>
<!-- MUSIC -->

<audio id="music" loop>
    <source src="Yeat - Out The Way (INSTRUMENTAL).mp3" type="audio/mpeg">
</audio>

<script>

window.onload = function(){

    const music = document.getElementById("music");

    music.volume = 0.4; // 40%

    music.muted = true; // starts muted
}

function toggleMusic(){

    const music = document.getElementById("music");
    const icon = document.querySelector("#muteBtn i");

    if(music.paused){
        music.play();
    }

    if(music.muted){

        music.muted = false;
        icon.className = "fa-solid fa-volume-high";

    }else{

        music.muted = true;
        icon.className = "fa-solid fa-volume-xmark";

    }
}

</script>

</body>
</html>
